---
## z-demineur-backend image version
##

deployment:
  image:
    repository: /z-demineur-backend
    pullPolicy: Always
  replicas: 1
  securityContext:
    enabled: true
  rolling:
    maxSurge: "25%"
    maxUnavailable: "25%"
  resources:
    # Observed on zelytra.fr: ~0m CPU / ~130Mi RSS at idle (Node process).
    # Requests sized on real usage; memory limit raised so a 130Mi process
    # is not sitting right under the OOM threshold.
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

service:
  port: 80
  targetPort: 8080

ingress:
  prefix: ""
  suffix: ""

config:
  LOGGER_NAME: z-demineur-backend-logger
