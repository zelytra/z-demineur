apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "z-demineur-backend.fullname" . }}-rewrite
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "z-demineur-backend.fullname" . }}
    chart: {{ include "z-demineur-backend.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replacePathRegex:
    regex: "^/api/(.*)"
    replacement: "/$1"
